<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArrayMed Service CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #3498db; --success: #2ecc71; --danger: #e74c3c;
            --warning: #f39c12; --dark: #2c3e50; --light: #ecf0f1; --bg: #f8f9fa;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--dark); }
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, #2980b9 100%);
            color: white; padding: 1.5rem 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 100;
        }
        .header-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-family: 'Poppins', sans-serif; font-size: 1.75rem; font-weight: 800; }
        .btn {
            padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; display: inline-flex; gap: 0.5rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #2980b9; transform: translateY(-2px); }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card {
            background: white; padding: 1.5rem; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid var(--primary);
        }
        .stat-card.success { border-color: var(--success); }
        .stat-card.warning { border-color: var(--warning); }
        .stat-card.danger { border-color: var(--danger); }
        .stat-label { font-size: 0.875rem; color: #7f8c8d; font-weight: 600; text-transform: uppercase; }
        .stat-value { font-size: 2.5rem; font-weight: 800; font-family: 'Poppins', sans-serif; margin-top: 0.5rem; }
        .section { background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid var(--light); }
        .section-title { font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700; }
        .message { padding: 1rem 1.5rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
        .message.success { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #4caf50; display: block; }
        .message.error { background: #ffebee; color: #c62828; border-left: 4px solid #f44336; display: block; }
        .message.info { background: #e3f2fd; color: #1565c0; border-left: 4px solid #2196f3; display: block; }
        .empty-state { text-align: center; padding: 3rem 2rem; color: #95a5a6; }
        .empty-state-icon { font-size: 4rem; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--bg); padding: 1rem; text-align: left; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 1rem; border-bottom: 1px solid var(--light); }
        tr:hover { background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>🛠️ Service CRM - Coordinator</h1>
            <button class="btn btn-primary" onclick="alert('Feature coming soon!')">➕ New Service Call</button>
        </div>
    </div>
    
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Today's Calls</div>
                <div class="stat-value" id="todayCalls">0</div>
            </div>
            <div class="stat-card success">
                <div class="stat-label">Completed Today</div>
                <div class="stat-value" id="completedToday">0</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-label">Pending Calls</div>
                <div class="stat-value" id="pendingCalls">0</div>
            </div>
            <div class="stat-card danger">
                <div class="stat-label">Critical Issues</div>
                <div class="stat-value" id="criticalCalls">0</div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-header">
                <h2 class="section-title">📋 Active Service Calls</h2>
                <button class="btn btn-primary" onclick="loadData()">🔄 Refresh</button>
            </div>
            
            <div id="message" class="message"></div>
            
            <div id="tableContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">📞</div>
                    <h3>Loading...</h3>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzca5L9cuMVPZybJR5fQqCktgrhCGF1CPF_dssoWEiuEnOrF4fZOsyAHHPa3I2mbG64/exec';
        
        window.onload = function() {
            loadData();
        };
        
        function loadData() {
            showMessage('info', 'Loading...');
            
            const callback = 'jsonpCallback_' + Date.now();
            window[callback] = function(data) {
                console.log('Data received:', data);
                
                if (data && data.success) {
                    const calls = data.data.calls || [];
                    updateStats(calls);
                    renderTable(calls);
                    hideMessage();
                } else {
                    showMessage('error', 'Error loading data');
                }
                
                delete window[callback];
            };
            
            const script = document.createElement('script');
            script.src = API_URL + '?action=getActiveCalls&callback=' + callback;
            document.body.appendChild(script);
            
            setTimeout(() => {
                if (window[callback]) {
                    showMessage('error', 'Connection timeout');
                    delete window[callback];
                }
            }, 10000);
        }
        
        function updateStats(calls) {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('todayCalls').textContent = calls.filter(c => c['Date Logged'] == today).length;
            document.getElementById('completedToday').textContent = calls.filter(c => c.Status == 'Completed').length;
            document.getElementById('pendingCalls').textContent = calls.filter(c => ['Assigned', 'In Progress'].includes(c.Status)).length;
            document.getElementById('criticalCalls').textContent = calls.filter(c => c.Urgency == 'Critical').length;
        }
        
        function renderTable(calls) {
            const container = document.getElementById('tableContainer');
            
            if (calls.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📞</div><h3>No active calls</h3></div>';
                return;
            }
            
            container.innerHTML = `
                <table>
                    <thead><tr>
                        <th>Call ID</th><th>Hospital</th><th>Equipment</th><th>Type</th>
                        <th>Urgency</th><th>Engineer</th><th>Status</th><th>Scheduled</th>
                    </tr></thead>
                    <tbody>${calls.map(c => `
                        <tr>
                            <td><strong>${c['Call ID']}</strong></td>
                            <td>${c['Hospital Name']}</td>
                            <td>${c['Equipment Model']}</td>
                            <td>${c['Service Type']}</td>
                            <td>${c.Urgency}</td>
                            <td>${c['Assigned Engineer']}</td>
                            <td>${c.Status}</td>
                            <td>${c['Scheduled Date']}</td>
                        </tr>
                    `).join('')}</tbody>
                </table>
            `;
        }
        
        function showMessage(type, text) {
            const msg = document.getElementById('message');
            msg.className = 'message ' + type;
            msg.textContent = text;
        }
        
        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }
    </script>
</body>
</html>
