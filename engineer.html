<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ede4d4">
  <title>ArrayMed – Engineer Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'DM Sans','Segoe UI',sans-serif;}
    body{background:#f5efe6;min-height:100vh;padding-bottom:72px;}

    /* ── LOGIN ── */
    .login-wrap{min-height:100vh;background:#f5efe6;display:flex;justify-content:center;
                align-items:center;padding:24px;}
    .login-box{max-width:420px;width:100%;background:#fffdf9;border-radius:20px;
               box-shadow:0 8px 40px rgba(90,70,50,.12);overflow:hidden;
               border:1px solid rgba(200,180,150,.25);animation:slideUp .5s ease;}
    @keyframes slideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
    .login-hdr{background:#ede4d4;border-bottom:2px solid #d9cfc0;padding:26px 32px;text-align:center;}
    .login-hdr h1{font-size:20px;font-weight:800;color:#2c2116;display:flex;align-items:center;
                  justify-content:center;gap:8px;}
    .login-hdr p{font-size:13px;color:#8b7355;margin-top:6px;}
    .login-body{padding:32px;}
    .fg{margin-bottom:18px;}
    .fg label{display:block;font-size:10px;font-weight:700;color:#8b7355;text-transform:uppercase;
              letter-spacing:.6px;margin-bottom:6px;}
    .fg select,.fg input{width:100%;padding:12px 15px;border:2px solid #e8ddd0;border-radius:10px;
      font-size:14px;color:#2c2116;background:#fffdf9;font-family:inherit;
      appearance:none;transition:border-color .2s;}
    .fg select:focus,.fg input:focus{outline:none;border-color:#667eea;}
    .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#b5451b,#8b2a0e);
               color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;
               cursor:pointer;transition:all .3s;box-shadow:0 4px 12px rgba(181,69,27,.3);
               font-family:inherit;}
    .login-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(181,69,27,.4);}
    .err-msg{background:#fde8e8;color:#c0392b;padding:12px 16px;border-radius:10px;
             margin-bottom:16px;font-size:13px;font-weight:600;display:none;
             border-left:4px solid #c0392b;}

    /* ── APP HEADER ── */
    .hdr{background:#ede4d4;border-bottom:2px solid #d9cfc0;padding:14px 16px;
         position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(90,70,50,.10);}
    .hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
    .hdr-name{font-size:16px;font-weight:800;color:#2c2116;display:flex;align-items:center;gap:8px;}
    .btn-lo{background:#2c2116;color:#ede4d4;border:none;padding:7px 14px;border-radius:8px;
            font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
    .hdr-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
    .hs{background:#fffdf9;border-radius:10px;padding:10px;text-align:center;
        border:1px solid rgba(200,180,150,.25);}
    .hs-val{font-size:20px;font-weight:800;background:linear-gradient(135deg,#667eea,#764ba2);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .hs-lbl{font-size:10px;color:#8b7355;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}

    /* ── TABS ── */
    .tabs{display:flex;background:#fffdf9;border-bottom:2px solid #e8ddd0;
          position:sticky;top:112px;z-index:99;}
    .tab{flex:1;padding:12px 8px;text-align:center;font-weight:700;font-size:13px;
         cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;color:#8b7355;}
    .tab.active{color:#b5451b;border-bottom-color:#b5451b;background:#f5ede0;}
    .tab-content{display:none;}
    .tab-content.active{display:block;}

    /* ── CALL CARDS ── */
    .container{padding:16px;max-width:620px;margin:0 auto;}
    .call-card{background:#fffdf9;border-radius:14px;padding:16px;margin-bottom:14px;
               box-shadow:0 4px 16px rgba(90,70,50,.08);
               border:1px solid rgba(200,180,150,.20);
               border-left:4px solid #667eea;}
    .call-card.critical{border-left-color:#e74c3c;background:#fff8f5;}
    .call-card.done{border-left-color:#27ae60;opacity:.85;}
    .call-id{font-size:12px;font-weight:800;color:#667eea;margin-bottom:6px;letter-spacing:.3px;}
    .call-hosp{font-size:16px;font-weight:800;color:#2c2116;margin-bottom:8px;}
    .call-row{display:flex;gap:6px;margin-bottom:4px;font-size:12px;color:#4a3728;}
    .call-row strong{color:#2c2116;min-width:80px;display:inline-block;}
    .badge{padding:3px 10px;border-radius:20px;font-weight:700;font-size:10px;display:inline-block;}
    .b-critical{background:#fde8e8;color:#c0392b;}
    .b-high{background:#fef3e2;color:#d68910;}
    .b-normal{background:#e8f4ff;color:#2471a3;}
    .b-low{background:#f0e6ff;color:#7d3c98;}
    .b-completed{background:#e8f8f0;color:#1e8449;}
    .b-inprogress{background:#e8f4ff;color:#2471a3;}
    .b-assigned{background:#fef3e2;color:#d68910;}
    .b-onhold{background:#fde8e8;color:#c0392b;}
    .card-actions{display:flex;gap:8px;margin-top:12px;}
    .btn-nav{flex:1;padding:9px;border:none;border-radius:9px;font-weight:700;font-size:13px;
             cursor:pointer;font-family:inherit;background:#2c2116;color:#ede4d4;transition:all .2s;}
    .btn-nav:hover{background:#4a3728;}
    .btn-report{flex:1;padding:9px;border:none;border-radius:9px;font-weight:700;font-size:13px;
                cursor:pointer;font-family:inherit;
                background:linear-gradient(135deg,#b5451b,#8b2a0e);color:#fff;
                box-shadow:0 3px 10px rgba(181,69,27,.28);transition:all .2s;}
    .btn-report:hover{transform:translateY(-1px);}
    .btn-refresh{width:100%;padding:10px;background:linear-gradient(135deg,#667eea,#764ba2);
                 color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;
                 cursor:pointer;font-family:inherit;margin-bottom:14px;transition:all .2s;}
    .btn-refresh:hover{transform:translateY(-1px);}
    .empty{text-align:center;padding:50px 20px;color:#8b7355;}
    .empty .icon{font-size:48px;margin-bottom:14px;}
    .empty h3{font-size:17px;font-weight:800;color:#4a3728;margin-bottom:6px;}

    /* ── REPORT MODAL ── */
    .ov{position:fixed;inset:0;background:rgba(44,33,22,.50);backdrop-filter:blur(4px);
        display:none;justify-content:center;align-items:flex-end;z-index:1000;}
    .ov.show{display:flex;}
    .modal{background:#fffdf9;border-radius:20px 20px 0 0;width:100%;max-width:600px;
           margin:0 auto;box-shadow:0 -8px 40px rgba(90,70,50,.20);
           animation:slideUp2 .35s ease;max-height:90vh;overflow-y:auto;}
    @keyframes slideUp2{from{transform:translateY(100%);}to{transform:translateY(0);}}
    .modal-hdr{background:linear-gradient(135deg,#2c2116,#4a3728);color:#ede4d4;
               padding:18px 20px;border-radius:20px 20px 0 0;
               display:flex;justify-content:space-between;align-items:center;
               position:sticky;top:0;z-index:10;}
    .modal-hdr h2{font-size:16px;font-weight:800;}
    .modal-close{background:rgba(255,255,255,.15);border:none;color:#ede4d4;
                 width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;}
    .modal-body{padding:20px;}
    .modal-foot{padding:16px 20px;background:#f5ede0;border-top:2px solid #ede4d8;
                position:sticky;bottom:0;}
    .fg-m{margin-bottom:16px;}
    .fg-m label{display:block;font-size:11px;font-weight:700;color:#6b5344;text-transform:uppercase;
                letter-spacing:.4px;margin-bottom:5px;}
    .fg-m input,.fg-m textarea{width:100%;padding:10px 12px;border:2px solid #e8ddd0;border-radius:9px;
      font-size:13px;color:#2c2116;background:#fffdf9;font-family:inherit;transition:border-color .2s;}
    .fg-m input:focus,.fg-m textarea:focus{outline:none;border-color:#667eea;}
    .fg-m textarea{min-height:90px;resize:vertical;}
    .cost-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
    .total-box{background:#f5ede0;border-radius:10px;padding:14px;text-align:center;
               border:2px solid #e8ddd0;margin-top:4px;}
    .total-box .lbl{font-size:11px;color:#8b7355;font-weight:700;text-transform:uppercase;}
    .total-box .val{font-size:22px;font-weight:800;color:#2c2116;margin-top:4px;}
    .upload-area{border:2px dashed #e8ddd0;border-radius:10px;padding:20px;text-align:center;
                 cursor:pointer;transition:all .2s;background:#fffdf9;}
    .upload-area:hover{border-color:#667eea;background:#f0f0ff;}
    .upload-area input{display:none;}
    .upload-icon{font-size:32px;margin-bottom:6px;}
    .upload-lbl{font-size:13px;font-weight:700;color:#667eea;}
    .upload-sub{font-size:11px;color:#8b7355;margin-top:3px;}
    .file-prev{margin-top:10px;padding:10px 14px;background:#e8f8f0;border-radius:8px;
               font-size:12px;color:#1e8449;font-weight:600;display:none;}
    .btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,#27ae60,#2ecc71);
                color:#fff;border:none;border-radius:10px;font-weight:800;font-size:15px;
                cursor:pointer;font-family:inherit;transition:all .2s;}
    .btn-submit:disabled{opacity:.6;cursor:not-allowed;}

    /* ── BOTTOM NAV ── */
    .bot-nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf9;
             display:flex;box-shadow:0 -2px 12px rgba(90,70,50,.12);z-index:98;
             border-top:2px solid #e8ddd0;}
    .nav-btn{flex:1;padding:10px 6px;border:none;background:none;cursor:pointer;
             font-size:11px;font-weight:700;color:#8b7355;transition:all .2s;font-family:inherit;}
    .nav-btn.active{color:#b5451b;background:#f5ede0;}
    .nav-icon{font-size:20px;display:block;margin-bottom:3px;}

    @media(min-width:600px){.container{padding:20px 24px;}}
  </style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <div class="login-hdr">
      <h1>
        <svg width="110" height="26" viewBox="0 0 200 44" xmlns="http://www.w3.org/2000/svg">
          <text y="38" font-family="Georgia,serif" font-size="42" font-weight="900" letter-spacing="-1">
            <tspan fill="#1a1a1a">Array</tspan><tspan fill="#e8192c">Med</tspan>
          </text>
        </svg>
      </h1>
      <p>Engineer Portal · Sign In</p>
    </div>
    <div class="login-body">
      <div id="loginErr" class="err-msg"></div>
      <div class="fg">
        <label>Your Name</label>
        <select id="engSelect">
          <option value="">⏳ Loading engineers…</option>
        </select>
      </div>
      <button class="login-btn" onclick="login()">Sign In →</button>
    </div>
  </div>
</div>

<!-- ── MAIN APP ── -->
<div id="appScreen" style="display:none;">
  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-name">
        <svg width="90" height="22" viewBox="0 0 200 44" xmlns="http://www.w3.org/2000/svg">
          <text y="38" font-family="Georgia,serif" font-size="42" font-weight="900" letter-spacing="-1">
            <tspan fill="#1a1a1a">Array</tspan><tspan fill="#e8192c">Med</tspan>
          </text>
        </svg>
        <span id="hdrName"></span>
      </div>
      <button class="btn-lo" onclick="logout()">🚪 Logout</button>
    </div>
    <div class="hdr-stats">
      <div class="hs"><div class="hs-val" id="stTotal">0</div><div class="hs-lbl">Total</div></div>
      <div class="hs"><div class="hs-val" id="stActive" style="background:linear-gradient(135deg,#e67e22,#f39c12);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">0</div><div class="hs-lbl">Active</div></div>
      <div class="hs"><div class="hs-val" id="stDone" style="background:linear-gradient(135deg,#27ae60,#2ecc71);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">0</div><div class="hs-lbl">Done</div></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-active" onclick="showTab('active')">
      🔥 Active (<span id="activeCount">0</span>)
    </div>
    <div class="tab" id="tab-done" onclick="showTab('done')">
      ✅ Completed (<span id="doneCount">0</span>)
    </div>
  </div>

  <div id="activeTab" class="tab-content active">
    <div class="container">
      <button class="btn-refresh" onclick="loadCalls()">🔄 Refresh Calls</button>
      <div id="activeList"></div>
    </div>
  </div>
  <div id="doneTab" class="tab-content">
    <div class="container">
      <div id="doneList"></div>
    </div>
  </div>

  <div class="bot-nav">
    <button class="nav-btn active" id="nav-active" onclick="showTab('active')">
      <span class="nav-icon">🔥</span>Active
    </button>
    <button class="nav-btn" onclick="loadCalls()">
      <span class="nav-icon">🔄</span>Refresh
    </button>
    <button class="nav-btn" id="nav-done" onclick="showTab('done')">
      <span class="nav-icon">✅</span>Done
    </button>
  </div>
</div>

<!-- ── REPORT MODAL ── -->
<div class="ov" id="reportOv">
  <div class="modal">
    <div class="modal-hdr">
      <h2>📤 Submit Service Report</h2>
      <button class="modal-close" onclick="closeReport()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="rCallId">

      <div class="cost-row">
        <div class="fg-m">
          <label>Parts Cost (₹)</label>
          <input type="number" id="rParts" min="0" step="0.01" placeholder="0" oninput="calcTotal()">
        </div>
        <div class="fg-m">
          <label>Labour Cost (₹)</label>
          <input type="number" id="rLabour" min="0" step="0.01" placeholder="0" oninput="calcTotal()">
        </div>
        <div class="fg-m">
          <label>Travel Cost (₹)</label>
          <input type="number" id="rTravel" min="0" step="0.01" placeholder="0" oninput="calcTotal()">
        </div>
      </div>
      <div class="total-box">
        <div class="lbl">Total Cost</div>
        <div class="val" id="rTotal">₹0.00</div>
      </div>

      <div class="fg-m" style="margin-top:16px;">
        <label>Issue Found <span style="color:#b5451b;">*</span></label>
        <textarea id="rIssue" placeholder="What was the root cause of the problem?"></textarea>
      </div>
      <div class="fg-m">
        <label>Action Taken <span style="color:#b5451b;">*</span></label>
        <textarea id="rAction" placeholder="What did you repair/replace/configure?"></textarea>
      </div>
      <div class="fg-m">
        <label>Service Report (PDF / Photos)</label>
        <div class="upload-area" onclick="document.getElementById('rFile').click()">
          <div class="upload-icon">📄</div>
          <div class="upload-lbl">Tap to upload files</div>
          <div class="upload-sub">PDF, DOC, or images</div>
          <input type="file" id="rFile" accept=".pdf,.doc,.docx,image/*" multiple>
        </div>
        <div class="file-prev" id="rFilePrev"></div>
      </div>
      <div class="fg-m">
        <label>360° Video (optional)</label>
        <div class="upload-area" onclick="document.getElementById('rVideo').click()">
          <div class="upload-icon">📹</div>
          <div class="upload-lbl">Tap to upload video</div>
          <div class="upload-sub">MP4, MOV, etc.</div>
          <input type="file" id="rVideo" accept="video/*">
        </div>
        <div class="file-prev" id="rVideoPrev"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-submit" id="rSubmitBtn" onclick="submitReport()">✅ Submit & Mark Completed</button>
    </div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzca5L9cuMVPZybJR5fQqCktgrhCGF1CPF_dssoWEiuEnOrF4fZOsyAHHPa3I2mbG64/exec';
let engineer = null, activeCalls = [], doneCalls = [];

// ── Utils ─────────────────────────────────────────────────────
function jsonp(url, cb) {
  const k = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  window[k] = d => { cb(d); delete window[k]; };
  const s = document.createElement('script');
  s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + k;
  document.body.appendChild(s);
}
function badgeCls(val) {
  const v = (val||'').toLowerCase().replace(/\s/g,'');
  const m = {critical:'b-critical',high:'b-high',low:'b-low',normal:'b-normal',
             completed:'b-completed',inprogress:'b-inprogress',assigned:'b-assigned',onhold:'b-onhold'};
  return m[v] || 'b-normal';
}

// ── Login ──────────────────────────────────────────────────────
function loadEngList() {
  jsonp(API + '?action=getEngineers', res => {
    const sel = document.getElementById('engSelect');
    if (res.success && res.data.engineers) {
      sel.innerHTML = '<option value="">Select Your Name</option>';
      res.data.engineers.forEach(e => {
        const o = document.createElement('option'); o.value=e.name; o.textContent=e.name;
        sel.appendChild(o);
      });
    } else {
      sel.innerHTML = '<option value="">⚠️ Could not load — refresh</option>';
    }
  });
}
function login() {
  engineer = document.getElementById('engSelect').value;
  if (!engineer) {
    document.getElementById('loginErr').textContent = '⚠️ Please select your name';
    document.getElementById('loginErr').style.display = 'block'; return;
  }
  localStorage.setItem('arraymed_engineer', engineer);
  showApp();
}
function logout() {
  if (!confirm('Log out?')) return;
  localStorage.removeItem('arraymed_engineer');
  engineer = null;
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}
function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('hdrName').textContent = '· ' + engineer;
  loadCalls();
}

// ── Calls ──────────────────────────────────────────────────────
function loadCalls() {
  document.getElementById('activeList').innerHTML =
    '<div style="text-align:center;padding:30px;color:#8b7355;"><span style="font-size:20px;">⏳</span><br>Loading…</div>';
  jsonp(API + '?action=getActiveCalls', res => {
    if (!res.success) {
      document.getElementById('activeList').innerHTML =
        '<div style="text-align:center;padding:30px;color:#e74c3c;">❌ Could not load calls. Tap Refresh.</div>';
      return;
    }
    const all = (res.data.calls || []).filter(c => c['Assigned Engineer'] === engineer);
    activeCalls = all.filter(c => {
      const s = (c.Status||'').toLowerCase().trim();
      return !['completed','cancelled','closed'].includes(s);
    });
    doneCalls = all.filter(c => {
      const s = (c.Status||'').toLowerCase().trim();
      return ['completed','cancelled','closed'].includes(s);
    });
    updateStats(all);
    renderActive();
    renderDone();
  });
}
function updateStats(all) {
  document.getElementById('stTotal').textContent  = all.length;
  document.getElementById('stActive').textContent = activeCalls.length;
  document.getElementById('stDone').textContent   = doneCalls.length;
  document.getElementById('activeCount').textContent = activeCalls.length;
  document.getElementById('doneCount').textContent   = doneCalls.length;
}
function renderActive() {
  const el = document.getElementById('activeList');
  if (!activeCalls.length) {
    el.innerHTML = `<div class="empty"><div class="icon">🎉</div>
      <h3>All caught up!</h3><p>No active calls assigned to you.</p></div>`;
    return;
  }
  el.innerHTML = activeCalls.map(c => `
    <div class="call-card ${c.Urgency==='Critical'?'critical':''}">
      <div class="call-id">${c['Call ID']||''}</div>
      <div class="call-hosp">${c['Hospital Name']||''}</div>
      <div class="call-row"><strong>Equipment:</strong> ${c['Equipment Model']||''} ${c['Serial Number']?'· '+c['Serial Number']:''}</div>
      <div class="call-row"><strong>Type:</strong> ${c['Service Type']||''} &nbsp; <span class="badge ${badgeCls(c.Urgency)}">${c.Urgency||''}</span></div>
      <div class="call-row"><strong>Issue:</strong> ${c['Issue Description']||''}</div>
      <div class="call-row"><strong>Contact:</strong> ${c['Contact Person']||''} · ${c['Phone Number']||''}</div>
      <div class="call-row"><strong>Scheduled:</strong> ${c['Scheduled Date']||''} ${c['Scheduled Time']?'at '+c['Scheduled Time']:''}</div>
      <div class="call-row"><strong>Status:</strong> <span class="badge ${badgeCls(c.Status)}">${c.Status||'Assigned'}</span></div>
      <div class="card-actions">
        <button class="btn-nav" onclick="navigate('${(c['Hospital Name']||'').replace(/'/g,"\\'")}','${(c.City||'').replace(/'/g,"\\'")}')">🗺️ Navigate</button>
        <button class="btn-report" onclick="openReport('${(c['Call ID']||'').replace(/'/g,"\\'")}')">📤 Submit Report</button>
      </div>
    </div>`).join('');
}
function renderDone() {
  const el = document.getElementById('doneList');
  if (!doneCalls.length) {
    el.innerHTML = `<div class="empty"><div class="icon">📋</div>
      <h3>No completed calls</h3><p>Complete your first service call!</p></div>`;
    return;
  }
  el.innerHTML = doneCalls.map(c => `
    <div class="call-card done">
      <div class="call-id">${c['Call ID']||''}</div>
      <div class="call-hosp">${c['Hospital Name']||''}</div>
      <div class="call-row"><strong>Equipment:</strong> ${c['Equipment Model']||''}</div>
      <div class="call-row"><strong>Type:</strong> ${c['Service Type']||''}</div>
      <div class="call-row"><strong>Issue:</strong> ${c['Issue Description']||''}</div>
      <div class="call-row"><strong>Contact:</strong> ${c['Contact Person']||''} · ${c['Phone Number']||''}</div>
      <div class="call-row"><strong>Scheduled:</strong> ${c['Scheduled Date']||''}</div>
      <div class="call-row"><strong>Status:</strong> <span class="badge b-completed">${c.Status||''}</span></div>
    </div>`).join('');
}

// ── Tabs ───────────────────────────────────────────────────────
function showTab(tab) {
  ['active','done'].forEach(t => {
    document.getElementById(t+'Tab').classList.toggle('active', t===tab);
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('nav-'+t) && document.getElementById('nav-'+t).classList.toggle('active', t===tab);
  });
}

// ── Navigate ───────────────────────────────────────────────────
function navigate(h, c) {
  window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(h+' '+c), '_blank');
}

// ── Report Modal ───────────────────────────────────────────────
function openReport(callId) {
  document.getElementById('rCallId').value = callId;
  ['rParts','rLabour','rTravel','rIssue','rAction'].forEach(id => document.getElementById(id).value='');
  document.getElementById('rTotal').textContent = '₹0.00';
  document.getElementById('rFile').value = '';
  document.getElementById('rVideo').value = '';
  document.getElementById('rFilePrev').style.display = 'none';
  document.getElementById('rVideoPrev').style.display = 'none';
  document.getElementById('rSubmitBtn').disabled = false;
  document.getElementById('rSubmitBtn').textContent = '✅ Submit & Mark Completed';
  document.getElementById('reportOv').classList.add('show');
}
function closeReport() { document.getElementById('reportOv').classList.remove('show'); }
function calcTotal() {
  const p = parseFloat(document.getElementById('rParts').value)||0;
  const l = parseFloat(document.getElementById('rLabour').value)||0;
  const t = parseFloat(document.getElementById('rTravel').value)||0;
  document.getElementById('rTotal').textContent = '₹' + (p+l+t).toFixed(2);
}
document.getElementById('rFile').onchange = e => {
  if (e.target.files.length) {
    const el = document.getElementById('rFilePrev');
    el.textContent = '📄 '+e.target.files.length+' file(s) selected';
    el.style.display = 'block';
  }
};
document.getElementById('rVideo').onchange = e => {
  if (e.target.files[0]) {
    const el = document.getElementById('rVideoPrev');
    el.textContent = '📹 '+e.target.files[0].name;
    el.style.display = 'block';
  }
};
function submitReport() {
  const issue  = document.getElementById('rIssue').value.trim();
  const action = document.getElementById('rAction').value.trim();
  if (!issue || !action) { alert('⚠️ Please fill in Issue Found and Action Taken'); return; }
  const callId = document.getElementById('rCallId').value;
  const parts  = document.getElementById('rParts').value||0;
  const labour = document.getElementById('rLabour').value||0;
  const travel = document.getElementById('rTravel').value||0;
  const btn = document.getElementById('rSubmitBtn');
  btn.disabled=true; btn.textContent='⏳ Submitting…';
  fetch(API, {method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'submitServiceReport',reportData:{
      callId, engineerName:engineer, partsCost:parts, laborCost:labour, travelCost:travel,
      issueFound:issue, actionTaken:action, resolutionStatus:'Resolved'
    }})
  }).then(() =>
    fetch(API, {method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'updateCallStatus',callId,status:'Completed'})
    })
  ).then(() => {
    closeReport();
    alert('✅ Report submitted!\n\nCosts:\nParts: ₹'+parts+'\nLabour: ₹'+labour+'\nTravel: ₹'+travel+
          '\nTotal: ₹'+(parseFloat(parts)+parseFloat(labour)+parseFloat(travel)).toFixed(2));
    setTimeout(loadCalls, 1000);
  }).catch(() => {
    btn.disabled=false; btn.textContent='✅ Submit & Mark Completed';
    alert('❌ Submission failed. Please try again.');
  });
}

// ── Init ───────────────────────────────────────────────────────
window.onload = () => {
  loadEngList();
  engineer = localStorage.getItem('arraymed_engineer');
  if (engineer) showApp();
};
</script>
